name: Automated Cloud Mirror & Sync Pipeline

on:
  workflow_dispatch:
    inputs:
      source_project:
        description: "Source Project UNIX name (e.g. rama982)"
        required: true
        type: string
        default: "rama982"
      device_filter:
        description: "Filter by Device (e.g. X6871, X6886, or ALL)"
        required: false
        type: string
        default: "X6871"
      category_filter:
        description: "Filter by Category (Flashable-ROMs, Custom-Recoveries, Custom-Kernels, Stock-Images, or ALL)"
        required: false
        type: string
        default: "ALL"
      max_files:
        description: "Max files to process in this run"
        required: false
        type: string
        default: "5"

jobs:
  cloud_sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Utilities (aria2, rsync, openssh)
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 rsync openssh-client curl jq
          pip install -r requirements.txt

      - name: Setup SSH Authentication for SourceForge
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SF_SSH_KEY }}" > ~/.ssh/id_sf
          chmod 600 ~/.ssh/id_sf
          ssh-keyscan -H frs.sourceforge.net >> ~/.ssh/known_hosts

      - name: Execute Automated Cloud Mirror & Publish Pipeline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PROJECT: ${{ secrets.SF_PROJECT }}
          SOURCE_PROJECT: ${{ inputs.source_project }}
          DEVICE_FILTER: ${{ inputs.device_filter }}
          CATEGORY_FILTER: ${{ inputs.category_filter }}
          MAX_FILES: ${{ inputs.max_files }}
        run: |
          python scripts/run_cloud_mirror.py
