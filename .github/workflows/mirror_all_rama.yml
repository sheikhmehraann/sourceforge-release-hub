name: Ultra-Fast Distributed Cloud Mirror Engine

on:
  workflow_dispatch:
    inputs:
      source_project:
        description: "Source Project UNIX Name (e.g. rama982)"
        required: true
        type: string
        default: "rama982"

jobs:
  parallel_shard_mirror:
    name: "Worker Shard ${{ matrix.shard + 1 }}/8"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Cloud Transfer Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 rsync openssh-client curl jq
          pip install -r requirements.txt

      - name: Configure SourceForge SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SF_SSH_KEY }}" > ~/.ssh/id_sf
          chmod 600 ~/.ssh/id_sf
          ssh-keyscan -H frs.sourceforge.net >> ~/.ssh/known_hosts

      - name: Execute Distributed Mirror for Shard ${{ matrix.shard + 1 }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PROJECT: ${{ secrets.SF_PROJECT }}
          SOURCE_PROJECT: ${{ inputs.source_project }}
          SHARD_INDEX: ${{ matrix.shard }}
          TOTAL_SHARDS: "8"
        run: |
          python scripts/run_cloud_mirror.py
