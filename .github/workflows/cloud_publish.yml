name: Fast Cloud Release & SourceForge Mirror Hub

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: "Direct URL of file to fetch (Gofile, Google Drive, direct link)"
        required: true
        type: string
      category:
        description: "Release Category"
        required: true
        type: choice
        options:
          - FLASHABLE
          - RECOVERY
          - KERNEL
          - STOCK-IMAGE
          - OTA-EXTRACT
          - PORT
          - PORT-FILES
          - OFFICIAL-FW
          - TOOLS
        default: "FLASHABLE"
      device:
        description: "Device Codename (e.g., X6871, X6886, Universal)"
        required: true
        type: string
        default: "X6871"
      subfolder:
        description: "Optional subfolder (e.g. XOS15, 6.6, BOOT)"
        required: false
        type: string
        default: ""
      release_tag:
        description: "GitHub Release Tag"
        required: false
        type: string
        default: ""
      release_title:
        description: "Release Title for GitHub"
        required: false
        type: string
        default: ""
      changelog:
        description: "Changelog / Notes"
        required: false
        type: string
        default: "Initial high-speed release mirrored via SourceForge Release Hub."

jobs:
  cloud_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Network Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 rsync openssh-client curl jq
          pip install -r requirements.txt

      - name: Setup SSH Authentication for SourceForge
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SF_SSH_KEY }}" > ~/.ssh/id_sf
          chmod 600 ~/.ssh/id_sf
          ssh-keyscan -H frs.sourceforge.net >> ~/.ssh/known_hosts

      - name: Execute Cloud Publish Pipeline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PROJECT: ${{ secrets.SF_PROJECT }}
          FILE_URL: ${{ inputs.file_url }}
          CATEGORY: ${{ inputs.category }}
          DEVICE: ${{ inputs.device }}
          SUBFOLDER: ${{ inputs.subfolder }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TITLE: ${{ inputs.release_title }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          python scripts/run_cloud_publish.py
